[workspace]
members = ["migration", "server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Merlyn, me@merlyn.dev"]

[workspace.dependencies]
# Common dependencies that can be shared across workspace members
axum = { version = "0.8.4", features = ["json", "multipart"] }
tokio = { version = "1.46.1", features = ["full"] }
clap = { version = "4.5.41", features = ["derive", "env"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.141", features = ["preserve_order"] }
uuid = { version = "1.17.0", features = ["v4"] }
sea-orm = { version = "1.1.13", features = ["runtime-tokio", "sqlx-sqlite"] }
sea-orm-migration = "1.1.13"
async-trait = "0.1.83"
chrono = "0.4.41"
pretty_env_logger = "0.5.0"
log = "0.4.27"
sha2 = "0.10.9"

